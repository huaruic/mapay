[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL:-https://rpc.testnet.monad.xyz}"

[etherscan]
monad_testnet = { key = "${SOURCIFY_KEY:-}", url = "https://sourcify-api-monad.blockvision.org" }
